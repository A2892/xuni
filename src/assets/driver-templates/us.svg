<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b57d0" />
      <stop offset="100%" stop-color="#0b4bd0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0b1720" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="20" fill="#eef6ff" />
  <rect x="32" y="28" width="736" height="140" rx="10" fill="url(#g1)" />
  <g transform="translate(48,60)">
    <text x="0" y="36" fill="#fff" font-size="42" font-family="Arial" font-weight="800">UNITED STATES</text>
    <text x="0" y="76" fill="#fff" font-size="18" font-family="Arial">Driver License (Sample)</text>
  </g>
  <!-- subtle microtext band -->
  <g opacity="0.06">
    <rect x="40" y="160" width="720" height="8" fill="#111" />
  </g>
  <!-- small US badge -->
  <g transform="translate(60,34)">
    <rect x="0" y="0" width="56" height="36" rx="6" fill="#fff" opacity="0.12" />
    <text x="8" y="24" fill="#fff" font-size="14" font-family="Arial" font-weight="700">US</text>
  </g>
  <!-- subtle watermark text -->
  <g opacity="0.05" transform="translate(220,220) rotate(-18)">
    <text x="0" y="0" fill="#0b1720" font-size="160" font-family="Arial" font-weight="800">LICENSE</text>
  </g>
</svg>
